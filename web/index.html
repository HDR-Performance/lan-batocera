<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091018">
  <title>LAN Batocera</title>
  <style>
    :root{color-scheme:dark;--bg:#091018;--panel:#111e27;--panel2:#152832;--line:#29404c;--muted:#9eb1bc;--accent:#41d6c3;--text:#eef4f7;--gold:#ffd166}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif;overscroll-behavior-y:none}button,input,select,a{font:inherit;-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}
    main{width:min(1240px,94vw);margin:4vh auto 10vh}h1{font-size:clamp(2.2rem,6vw,4.5rem);margin:.1em 0}.sub,#status{color:var(--muted)}h2{margin:1.7rem 0 .8rem;font-size:1.25rem}
    .views{display:flex;gap:8px;overflow:auto;margin:1.6rem 0 1rem;scrollbar-width:thin}.view,.category,.refresh{min-height:44px;white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);padding:10px 15px;cursor:pointer}.view.active,.view:hover,.category.active,.category:hover,.refresh:hover{border-color:var(--accent);background:#153037}.badge{color:var(--muted);margin-left:5px}.refresh{margin-left:auto}.refresh[disabled]{opacity:.55;cursor:wait}
    .systems{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.console{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:12px;min-height:112px;text-align:left;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,var(--panel2),var(--panel));color:var(--text);padding:12px;cursor:pointer;transition:.15s ease}.console:hover,.console.active{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 22px #0004}.console-icon{display:grid;place-items:center;width:64px;height:64px;border:1px solid #35515e;border-radius:14px;background:#09151d;color:var(--accent)}.console-icon svg{width:52px;height:52px;display:block;overflow:visible}.console:hover .console-icon,.console.active .console-icon{border-color:var(--accent);background:#10272d}.console-copy{min-width:0}.console-name{display:block;font-weight:750;line-height:1.15;overflow-wrap:anywhere}.console-count,.console-category{display:block;color:var(--muted);font-size:.78rem;margin-top:5px}.console-category{color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
    .toolbar{position:sticky;z-index:5;top:0;margin:1.4rem 0;padding:13px;background:#091018e8;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}.categories{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.filters{display:grid;grid-template-columns:minmax(220px,1fr) minmax(170px,270px);gap:10px}input,select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:11px 13px;outline:none}input:focus,select:focus{border-color:var(--accent)}.alphabet{display:flex;gap:5px;overflow-x:auto;padding:10px 1px 2px;scrollbar-width:thin}.letter{flex:0 0 34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0;cursor:pointer;font-size:.82rem;font-weight:700}.letter:hover,.letter.active{border-color:var(--accent);background:#153037;color:var(--accent)}.letter[disabled]{opacity:.3;cursor:default}.letter-clear{flex-basis:46px}
    .summary{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 2px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.game{position:relative;min-height:116px;border:1px solid var(--line);border-radius:12px;background:var(--panel);content-visibility:auto;contain-intrinsic-size:116px;transition:.15s ease}.game:hover{border-color:var(--accent);transform:translateY(-2px)}.game-link{display:block;min-height:114px;padding:17px 52px 17px 17px;color:inherit;text-decoration:none}.system{color:var(--accent);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}.name{margin-top:8px;font-weight:700;overflow-wrap:anywhere}.favorite{position:absolute;z-index:2;right:6px;top:5px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#71838d;font-size:1.55rem;line-height:1;cursor:pointer}.favorite:hover,.favorite.active{color:var(--gold);background:#ffffff0d}.empty{grid-column:1/-1;padding:4rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}#more{display:none;min-height:48px;margin:22px auto 0;border:1px solid var(--accent);border-radius:10px;background:#153037;color:var(--text);padding:11px 24px;cursor:pointer}.pc-help{color:var(--muted);font-size:.82rem;margin-top:8px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    @media(max-width:620px){body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}main{width:min(94vw,620px);margin-top:2vh;margin-bottom:4vh}.sub{font-size:.9rem}.views{position:fixed;z-index:20;left:0;right:0;bottom:0;margin:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden;background:#0b151df5;border-top:1px solid var(--line)}.view{min-width:0;white-space:normal;line-height:1.1;padding:10px 4px;font-size:.76rem}.refresh{grid-column:1/-1;margin:0;min-height:40px;padding:7px;font-size:.78rem}.badge{display:block;margin:3px 0 0}.filters{grid-template-columns:1fr}.toolbar{top:0;margin-top:1rem}.alphabet{margin-right:-12px;padding-right:12px}.letter{flex-basis:38px;height:38px}.systems{grid-template-columns:1fr 1fr}.games{grid-template-columns:1fr 1fr;gap:9px}.game-link{padding:13px 48px 13px 13px}.game{min-height:112px}.pc-help{display:none}}
    @media(max-width:410px){.systems,.games{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>LAN Batocera</h1><div class="sub">Choose a console or find a game. Touch-friendly on phones and keyboard-friendly on PCs.</div>
  <nav class="views" aria-label="Library sections">
    <button class="view active" data-view="all">All Games <span class="badge" id="allCount"></span></button>
    <button class="view" data-view="favorites">★ Favorites <span class="badge" id="favoriteCount"></span></button>
    <button class="view" data-view="recent">Recently Played <span class="badge" id="recentCount"></span></button>
    <button class="refresh" id="refresh" type="button" title="Scan ROM folders for newly added games">↻ Refresh Games</button>
  </nav>
  <section id="consoleSection"><h2>Choose a console</h2><div class="systems" id="systems"></div></section>
  <section class="toolbar" aria-label="Game filters">
    <div class="categories" id="categories"></div>
    <div class="filters"><input id="search" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off"><select id="system" aria-label="Filter by system"><option value="">All systems</option></select></div><div class="alphabet" id="alphabet" aria-label="Filter games by first letter"></div><div class="pc-help">PC: press / to search, Esc to clear, and arrow keys to move between games.</div>
  </section>
  <div class="summary"><div id="status">Scanning the library…</div><div id="shown"></div></div>
  <div class="games" id="games"></div><button id="more" type="button">Show more games</button>
</main>
<script>
const PAGE_SIZE=matchMedia('(max-width:620px)').matches?60:120,FAVORITES_KEY='batoceraLanFavorites',RECENT_KEY='batoceraLanRecent';
const ICON=(body)=>`<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const CONSOLE_ICONS={
  atari2600:ICON('<path d="M10 22h44l-3 24H13z"/><path d="M14 28h36M22 22l3-7h14l3 7"/><circle cx="22" cy="37" r="3"/><path d="M34 34h10m-5-4v8"/>'),
  atari7800:ICON('<rect x="8" y="21" width="48" height="24" rx="5"/><path d="M13 28h38M18 34h16"/><circle cx="44" cy="36" r="3"/><circle cx="51" cy="36" r="2"/>'),
  nes:ICON('<path d="M7 24h50v25H7z"/><path d="M11 29h34v6H11zM12 41h18"/><circle cx="47" cy="41" r="3"/><path d="M54 49v-9"/>'),
  snes:ICON('<path d="M8 25h48l-4 23H12z"/><path d="M16 31h24M18 39h10"/><circle cx="43" cy="37" r="2"/><circle cx="49" cy="34" r="2"/><circle cx="49" cy="40" r="2"/>'),
  n64:ICON('<path d="M8 38c2-10 7-15 14-14l10 5 10-5c7-1 12 4 14 14l-7 8-8-10H23l-8 10z"/><path d="M32 29v18M17 33h8m-4-4v8"/><circle cx="45" cy="31" r="2"/><circle cx="50" cy="35" r="2"/>'),
  megadrive:ICON('<ellipse cx="32" cy="34" rx="25" ry="16"/><ellipse cx="32" cy="33" rx="12" ry="10"/><path d="M21 19h22M17 43h30"/><circle cx="32" cy="33" r="4"/>'),
  sega32x:ICON('<path d="M16 24l7-8h18l7 8 5 22H11z"/><ellipse cx="32" cy="28" rx="13" ry="7"/><path d="M19 39h26M24 46v-7m16 7v-7"/>'),
  mastersystem:ICON('<path d="M8 24h48v25H8z"/><path d="M12 30h40M16 38h22M16 43h12"/><circle cx="47" cy="40" r="3"/>'),
  gba:ICON('<path d="M9 24c10-5 36-5 46 0l-3 24-10-7H22l-10 7z"/><rect x="23" y="24" width="18" height="12" rx="2"/><path d="M15 34h8m-4-4v8"/><circle cx="47" cy="32" r="2"/><circle cx="51" cy="36" r="2"/>'),
  gb:ICON('<rect x="18" y="7" width="28" height="50" rx="5"/><rect x="22" y="12" width="20" height="20" rx="2"/><path d="M23 41h9m-4.5-4.5v9"/><circle cx="38" cy="40" r="2"/><circle cx="41" cy="45" r="2"/>'),
  gbc:ICON('<rect x="18" y="7" width="28" height="50" rx="7"/><rect x="22" y="12" width="20" height="22" rx="3"/><path d="M23 43h9m-4.5-4.5v9"/><circle cx="38" cy="42" r="2"/><circle cx="41" cy="47" r="2"/>'),
  gamegear:ICON('<path d="M6 21c12-5 40-5 52 0l-4 27c-11 5-33 5-44 0z"/><rect x="21" y="23" width="22" height="19" rx="2"/><path d="M11 32h8m-4-4v8"/><circle cx="49" cy="31" r="2"/>'),
  lynx:ICON('<rect x="5" y="20" width="54" height="28" rx="8"/><rect x="20" y="23" width="24" height="22" rx="2"/><path d="M9 33h8m-4-4v8"/><circle cx="51" cy="32" r="2"/>'),
  ngp:ICON('<rect x="16" y="8" width="32" height="48" rx="8"/><rect x="21" y="13" width="22" height="21" rx="2"/><circle cx="25" cy="43" r="4"/><circle cx="39" cy="41" r="2"/><circle cx="42" cy="46" r="2"/>'),
  ngpc:ICON('<rect x="16" y="8" width="32" height="48" rx="8"/><rect x="21" y="13" width="22" height="21" rx="2"/><circle cx="25" cy="43" r="4"/><circle cx="39" cy="41" r="2"/><circle cx="42" cy="46" r="2"/>'),
  wswan:ICON('<rect x="7" y="17" width="50" height="30" rx="7"/><rect x="21" y="20" width="25" height="24" rx="2"/><path d="M11 32h7m-3.5-3.5v7"/><circle cx="51" cy="27" r="2"/><circle cx="51" cy="37" r="2"/>'),
  wswanc:ICON('<rect x="7" y="17" width="50" height="30" rx="7"/><rect x="21" y="20" width="25" height="24" rx="2"/><path d="M11 32h7m-3.5-3.5v7"/><circle cx="51" cy="27" r="2"/><circle cx="51" cy="37" r="2"/>')
};
const fallbackConsoleIcon=ICON('<rect x="8" y="20" width="48" height="29" rx="7"/><path d="M18 34h10m-5-5v10"/><circle cx="42" cy="32" r="2"/><circle cx="48" cy="38" r="2"/>');
let allGames=[],gameByPath=new Map(),filtered=[],shown=0,activeCategory='All',activeView='all',activeSystem='',activeLetter='',searchTimer;
const els={systems:document.querySelector('#systems'),consoleSection:document.querySelector('#consoleSection'),categories:document.querySelector('#categories'),alphabet:document.querySelector('#alphabet'),search:document.querySelector('#search'),system:document.querySelector('#system'),status:document.querySelector('#status'),shown:document.querySelector('#shown'),games:document.querySelector('#games'),more:document.querySelector('#more'),refresh:document.querySelector('#refresh'),allCount:document.querySelector('#allCount'),favoriteCount:document.querySelector('#favoriteCount'),recentCount:document.querySelector('#recentCount')};
const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}},save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
let favoritePaths=new Set(load(FAVORITES_KEY,[])),recentPaths=load(RECENT_KEY,[]);
const countBy=(items,key)=>items.reduce((out,item)=>(out[item[key]]=(out[item[key]]||0)+1,out),{});
function updateBadges(){els.allCount.textContent=`(${allGames.length.toLocaleString()})`;els.favoriteCount.textContent=`(${favoritePaths.size.toLocaleString()})`;els.recentCount.textContent=`(${recentPaths.filter(path=>gameByPath.has(path)).length.toLocaleString()})`}
function makeCategory(name,count){const button=document.createElement('button');button.type='button';button.className='category'+(name===activeCategory?' active':'');button.textContent=`${name} (${count.toLocaleString()})`;button.dataset.category=name;button.onclick=()=>{activeCategory=name;activeSystem='';activeLetter='';syncControls();applyFilters()};return button}
function populateCategories(){const counts=countBy(allGames,'category');els.categories.replaceChildren(makeCategory('All',allGames.length),...Object.keys(counts).sort().map(name=>makeCategory(name,counts[name])))}
function populateSystems(){const current=activeSystem,categoryPool=activeCategory==='All'?allGames:allGames.filter(g=>g.category===activeCategory),counts=countBy(categoryPool,'systemName');els.system.replaceChildren(new Option('All systems',''),...Object.keys(counts).sort().map(name=>new Option(`${name} (${counts[name].toLocaleString()})`,name)));if([...els.system.options].some(o=>o.value===current))els.system.value=current;else activeSystem=''}
function populateConsoleTiles(){const groups={};for(const game of allGames){groups[game.systemName]??={count:0,category:game.category,system:game.system};groups[game.systemName].count++}const buttons=Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([name,data])=>{const button=document.createElement('button');button.type='button';button.className='console'+(activeSystem===name?' active':'');button.setAttribute('aria-label',`${name}, ${data.count.toLocaleString()} games`);button.innerHTML='<span class="console-icon" aria-hidden="true"></span><span class="console-copy"><span class="console-name"></span><span class="console-count"></span><span class="console-category"></span></span>';button.querySelector('.console-icon').innerHTML=CONSOLE_ICONS[data.system]||fallbackConsoleIcon;button.querySelector('.console-name').textContent=name;button.querySelector('.console-count').textContent=`${data.count.toLocaleString()} games`;button.querySelector('.console-category').textContent=data.category;button.onclick=()=>{activeLetter='';setView('all');activeCategory=data.category;activeSystem=name;syncControls();applyFilters();document.querySelector('.toolbar').scrollIntoView({behavior:'smooth',block:'start'})};return button});els.systems.replaceChildren(...buttons)}
function firstGroup(name){const first=(name.trim()[0]||'').toLocaleUpperCase();return first>='A'&&first<='Z'?first:'#'}
function populateAlphabet(pool){const available=new Set(pool.map(game=>firstGroup(game.name))),labels=['','',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];labels[0]='ALL';labels[1]='#';const buttons=labels.map(label=>{const value=label==='ALL'?'':label,button=document.createElement('button');button.type='button';button.className='letter'+(label==='ALL'?' letter-clear':'')+(activeLetter===value?' active':'');button.textContent=label;button.disabled=label!=='ALL'&&!available.has(value);button.setAttribute('aria-label',label==='ALL'?'Show every starting letter':`Show games beginning with ${label}`);button.onclick=()=>{activeLetter=value;applyFilters()};return button});els.alphabet.replaceChildren(...buttons)}
function syncControls(){els.categories.querySelectorAll('.category').forEach(b=>b.classList.toggle('active',b.dataset.category===activeCategory));populateSystems();els.system.value=activeSystem;populateConsoleTiles()}
function setView(view){activeView=view;if(view!=='all')activeLetter='';document.querySelectorAll('.view').forEach(b=>b.classList.toggle('active',b.dataset.view===view));els.consoleSection.style.display=view==='all'?'block':'none';els.alphabet.style.display=view==='all'?'flex':'none';applyFilters()}
function recordRecent(path){recentPaths=[path,...recentPaths.filter(item=>item!==path)].slice(0,50);save(RECENT_KEY,recentPaths);updateBadges()}
function toggleFavorite(path){if(favoritePaths.has(path))favoritePaths.delete(path);else favoritePaths.add(path);save(FAVORITES_KEY,[...favoritePaths]);updateBadges();if(activeView==='favorites')applyFilters();else document.querySelectorAll('.game').forEach(card=>{if(card.dataset.path===path){const button=card.querySelector('.favorite'),game=gameByPath.get(path),active=favoritePaths.has(path);button.classList.toggle('active',active);button.setAttribute('aria-label',`${active?'Remove':'Add'} ${game.name} ${active?'from':'to'} favorites`)}})}
function gameCard(game){const card=document.createElement('article'),link=document.createElement('a'),favorite=document.createElement('button'),system=document.createElement('div'),name=document.createElement('div');card.className='game';card.dataset.path=game.path;link.className='game-link';link.href='/play.html?core='+encodeURIComponent(game.core)+'&path='+encodeURIComponent(game.path)+'&name='+encodeURIComponent(game.name);link.onclick=()=>recordRecent(game.path);favorite.type='button';favorite.className='favorite'+(favoritePaths.has(game.path)?' active':'');favorite.title='Toggle favorite';favorite.setAttribute('aria-label',`${favoritePaths.has(game.path)?'Remove':'Add'} ${game.name} ${favoritePaths.has(game.path)?'from':'to'} favorites`);favorite.textContent='★';favorite.onclick=()=>toggleFavorite(game.path);system.className='system';name.className='name';system.textContent=game.systemName;name.textContent=game.name;link.append(system,name);card.append(favorite,link);return card}
function render(reset=false){if(reset){shown=0;els.games.replaceChildren()}const end=Math.min(shown+PAGE_SIZE,filtered.length),fragment=document.createDocumentFragment();for(let i=shown;i<end;i++)fragment.append(gameCard(filtered[i]));els.games.append(fragment);shown=end;els.shown.textContent=filtered.length?`${shown.toLocaleString()} of ${filtered.length.toLocaleString()} shown`:'';els.more.style.display=shown<filtered.length?'block':'none';if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=activeView==='favorites'?'No favorites yet. Select the star on any game to add one.':activeView==='recent'?'No recently played games on this device yet.':'No games match these filters.';els.games.append(empty)}}
function applyFilters(){if(!allGames.length)return;const query=els.search.value.trim().toLocaleLowerCase(),system=activeSystem||els.system.value;let pool=allGames;if(activeView==='favorites')pool=pool.filter(g=>favoritePaths.has(g.path));if(activeView==='recent')pool=recentPaths.map(path=>gameByPath.get(path)).filter(Boolean);const scoped=pool.filter(game=>(activeCategory==='All'||game.category===activeCategory)&&(!system||game.systemName===system)&&(!query||game.name.toLocaleLowerCase().includes(query)));if(activeView==='all')populateAlphabet(scoped);filtered=scoped.filter(game=>!activeLetter||firstGroup(game.name)===activeLetter);const label=activeView==='favorites'?'favorite':activeView==='recent'?'recent':'game';els.status.textContent=`${filtered.length.toLocaleString()} ${label}${filtered.length===1?'':'s'} found`;render(true)}
function moveGameFocus(delta){const links=[...document.querySelectorAll('.game-link')];if(!links.length)return;const current=links.indexOf(document.activeElement),columns=Math.max(1,Math.round(els.games.clientWidth/links[0].closest('.game').clientWidth)),step=delta==='up'?-columns:delta==='down'?columns:delta==='left'?-1:1;links[Math.max(0,Math.min(links.length-1,(current<0?0:current)+step))].focus()}
document.querySelectorAll('.view').forEach(button=>button.onclick=()=>{activeCategory='All';activeSystem='';activeLetter='';syncControls();setView(button.dataset.view)});els.search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(applyFilters,120)});els.system.addEventListener('change',()=>{activeSystem=els.system.value;activeLetter='';populateConsoleTiles();applyFilters()});els.more.addEventListener('click',()=>render(false));els.refresh.addEventListener('click',()=>loadGames(true));
document.addEventListener('keydown',event=>{if(event.key==='/'&&!['INPUT','SELECT'].includes(document.activeElement.tagName)){event.preventDefault();els.search.focus()}else if(event.key==='Escape'&&els.search.value){els.search.value='';applyFilters();els.search.focus()}else if(!['INPUT','SELECT'].includes(document.activeElement.tagName)&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();moveGameFocus(event.key.slice(5).toLowerCase())}});
function loadGames(refresh=false){els.refresh.disabled=true;els.refresh.textContent=refresh?'Scanning…':'↻ Refresh Games';if(refresh)els.status.textContent='Scanning ROM folders for new games…';fetch('/api/games?scan='+Date.now(),{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error();return response.json()}).then(items=>{allGames=items;gameByPath=new Map(items.map(game=>[game.path,game]));favoritePaths=new Set([...favoritePaths].filter(path=>gameByPath.has(path)));recentPaths=recentPaths.filter(path=>gameByPath.has(path));save(FAVORITES_KEY,[...favoritePaths]);save(RECENT_KEY,recentPaths);populateCategories();syncControls();updateBadges();applyFilters()}).catch(()=>els.status.textContent='Could not read the game library.').finally(()=>{els.refresh.disabled=false;els.refresh.textContent='↻ Refresh Games'})}
loadGames();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Batocera LAN Arcade</title>
  <style>
    :root{color-scheme:dark;--bg:#091018;--panel:#111e27;--line:#29404c;--muted:#9eb1bc;--accent:#41d6c3;--text:#eef4f7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}button,input,select{font:inherit}
    main{width:min(1220px,94vw);margin:5vh auto 10vh}h1{font-size:clamp(2.2rem,6vw,4.5rem);margin:.1em 0}.sub,#status{color:var(--muted)}
    .toolbar{position:sticky;z-index:5;top:0;margin:1.5rem 0;padding:14px;background:#091018e8;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
    .categories{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.category{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);padding:9px 14px;cursor:pointer}.category.active,.category:hover{border-color:var(--accent);background:#153037}
    .filters{display:grid;grid-template-columns:minmax(220px,1fr) minmax(170px,260px);gap:10px}input,select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:11px 13px;outline:none}input:focus,select:focus{border-color:var(--accent)}
    .summary{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 2px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .game{display:block;min-height:106px;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:inherit;text-decoration:none;transition:.15s ease}.game:hover,.game:focus{border-color:var(--accent);transform:translateY(-2px)}
    .system{color:var(--accent);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}.name{margin-top:8px;font-weight:700;overflow-wrap:anywhere}.empty{grid-column:1/-1;padding:4rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
    #more{display:none;margin:22px auto 0;border:1px solid var(--accent);border-radius:10px;background:#153037;color:var(--text);padding:11px 24px;cursor:pointer}
    @media(max-width:620px){main{margin-top:3vh}.filters{grid-template-columns:1fr}.games{grid-template-columns:1fr 1fr}.game{min-height:96px;padding:13px}}
    @media(max-width:410px){.games{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>Batocera LAN Arcade</h1>
  <div class="sub">Choose a game. Connect a controller to this device before launching.</div>
  <section class="toolbar" aria-label="Game filters">
    <div class="categories" id="categories"></div>
    <div class="filters"><input id="search" type="search" placeholder="Search games…" autocomplete="off"><select id="system"><option value="">All systems</option></select></div>
  </section>
  <div class="summary"><div id="status">Scanning the library…</div><div id="shown"></div></div>
  <div class="games" id="games"></div><button id="more" type="button">Show more games</button>
</main>
<script>
const PAGE_SIZE=160;
let allGames=[],filtered=[],shown=0,activeCategory='All';
const els={categories:document.querySelector('#categories'),search:document.querySelector('#search'),system:document.querySelector('#system'),status:document.querySelector('#status'),shown:document.querySelector('#shown'),games:document.querySelector('#games'),more:document.querySelector('#more')};
const countBy=(items,key)=>items.reduce((out,item)=>(out[item[key]]=(out[item[key]]||0)+1,out),{});
function makeCategory(name,count){const button=document.createElement('button');button.type='button';button.className='category'+(name===activeCategory?' active':'');button.textContent=`${name} (${count.toLocaleString()})`;button.dataset.category=name;button.onclick=()=>{activeCategory=name;els.categories.querySelectorAll('.category').forEach(b=>b.classList.toggle('active',b.dataset.category===name));populateSystems();applyFilters()};return button}
function populateCategories(){const counts=countBy(allGames,'category');els.categories.replaceChildren(makeCategory('All',allGames.length),...Object.keys(counts).sort().map(name=>makeCategory(name,counts[name])))}
function populateSystems(){const current=els.system.value;const pool=activeCategory==='All'?allGames:allGames.filter(g=>g.category===activeCategory);const counts=countBy(pool,'systemName');const options=[new Option('All systems',''),...Object.keys(counts).sort().map(name=>new Option(`${name} (${counts[name].toLocaleString()})`,name))];els.system.replaceChildren(...options);if([...els.system.options].some(o=>o.value===current))els.system.value=current}
function gameCard(game){const a=document.createElement('a');a.className='game';a.href='/play.html?core='+encodeURIComponent(game.core)+'&path='+encodeURIComponent(game.path)+'&name='+encodeURIComponent(game.name);const system=document.createElement('div'),name=document.createElement('div');system.className='system';name.className='name';system.textContent=game.systemName;name.textContent=game.name;a.append(system,name);return a}
function render(reset=false){if(reset){shown=0;els.games.replaceChildren()}const end=Math.min(shown+PAGE_SIZE,filtered.length),fragment=document.createDocumentFragment();for(let i=shown;i<end;i++)fragment.append(gameCard(filtered[i]));els.games.append(fragment);shown=end;els.shown.textContent=filtered.length?`${shown.toLocaleString()} of ${filtered.length.toLocaleString()} shown`:'';els.more.style.display=shown<filtered.length?'block':'none';if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No games match these filters.';els.games.append(empty)}}
function applyFilters(){const query=els.search.value.trim().toLocaleLowerCase(),system=els.system.value;filtered=allGames.filter(game=>(activeCategory==='All'||game.category===activeCategory)&&(!system||game.systemName===system)&&(!query||game.name.toLocaleLowerCase().includes(query)));els.status.textContent=`${filtered.length.toLocaleString()} game${filtered.length===1?'':'s'} found`;render(true)}
els.search.addEventListener('input',applyFilters);els.system.addEventListener('change',applyFilters);els.more.addEventListener('click',()=>render(false));
fetch('/api/games').then(response=>{if(!response.ok)throw new Error();return response.json()}).then(items=>{allGames=items;populateCategories();populateSystems();applyFilters()}).catch(()=>els.status.textContent='Could not read the game library.');
</script></body></html>

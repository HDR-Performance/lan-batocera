<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Batocera LAN Arcade</title>
  <style>
    :root{color-scheme:dark;--accent:#41d6c3}*{box-sizing:border-box}body{margin:0;background:#091018;color:#eef4f7;font:16px system-ui,sans-serif}main{width:min(980px,92vw);margin:8vh auto}h1{font-size:clamp(2rem,7vw,4.5rem);margin:.1em 0}.sub{color:#9eb1bc;margin-bottom:2rem}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.game{display:block;padding:18px;border:1px solid #29404c;border-radius:12px;background:#111e27;color:inherit;text-decoration:none}.game:hover,.game:focus{border-color:var(--accent);transform:translateY(-2px)}.system{color:var(--accent);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em}.name{margin-top:7px;font-weight:700;overflow-wrap:anywhere}#status{color:#9eb1bc}
  </style>
</head>
<body><main><h1>Batocera LAN Arcade</h1><div class="sub">Choose a game. Connect a controller to this device before launching.</div><div id="status">Scanning the library…</div><div class="games" id="games"></div></main>
<script>
fetch('/api/games').then(r=>r.json()).then(items=>{
  const status=document.querySelector('#status'), list=document.querySelector('#games');
  status.textContent=items.length?`${items.length} compatible game${items.length===1?'':'s'} found`:'No browser-compatible games found yet.';
  for(const game of items){const a=document.createElement('a');a.className='game';a.href='/play.html?core='+encodeURIComponent(game.core)+'&path='+encodeURIComponent(game.path)+'&name='+encodeURIComponent(game.name);a.innerHTML='<div class="system"></div><div class="name"></div>';a.querySelector('.system').textContent=game.system;a.querySelector('.name').textContent=game.name;list.append(a)}
}).catch(()=>document.querySelector('#status').textContent='Could not read the game library.');
</script></body></html>

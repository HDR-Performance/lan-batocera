<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Batocera LAN Arcade</title>
  <style>
    :root{color-scheme:dark;--bg:#091018;--panel:#111e27;--panel2:#152832;--line:#29404c;--muted:#9eb1bc;--accent:#41d6c3;--text:#eef4f7;--gold:#ffd166}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}button,input,select{font:inherit}
    main{width:min(1240px,94vw);margin:4vh auto 10vh}h1{font-size:clamp(2.2rem,6vw,4.5rem);margin:.1em 0}.sub,#status{color:var(--muted)}h2{margin:1.7rem 0 .8rem;font-size:1.25rem}
    .views{display:flex;gap:8px;overflow:auto;margin:1.6rem 0 1rem}.view,.category{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);padding:10px 15px;cursor:pointer}.view.active,.view:hover,.category.active,.category:hover{border-color:var(--accent);background:#153037}.badge{color:var(--muted);margin-left:5px}
    .systems{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.console{min-height:86px;text-align:left;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,var(--panel2),var(--panel));color:var(--text);padding:14px;cursor:pointer}.console:hover,.console.active{border-color:var(--accent);transform:translateY(-2px)}.console-name{display:block;font-weight:750}.console-count,.console-category{display:block;color:var(--muted);font-size:.78rem;margin-top:5px}.console-category{color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
    .toolbar{position:sticky;z-index:5;top:0;margin:1.4rem 0;padding:13px;background:#091018e8;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}.categories{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.filters{display:grid;grid-template-columns:minmax(220px,1fr) minmax(170px,270px);gap:10px}input,select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:11px 13px;outline:none}input:focus,select:focus{border-color:var(--accent)}
    .summary{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 2px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.game{position:relative;min-height:116px;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:.15s ease}.game:hover{border-color:var(--accent);transform:translateY(-2px)}.game-link{display:block;min-height:114px;padding:17px 48px 17px 17px;color:inherit;text-decoration:none}.system{color:var(--accent);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}.name{margin-top:8px;font-weight:700;overflow-wrap:anywhere}.favorite{position:absolute;z-index:2;right:10px;top:9px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#71838d;font-size:1.45rem;line-height:1;cursor:pointer}.favorite:hover,.favorite.active{color:var(--gold);background:#ffffff0d}.empty{grid-column:1/-1;padding:4rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}#more{display:none;margin:22px auto 0;border:1px solid var(--accent);border-radius:10px;background:#153037;color:var(--text);padding:11px 24px;cursor:pointer}
    @media(max-width:620px){main{margin-top:2vh}.filters{grid-template-columns:1fr}.systems{grid-template-columns:1fr 1fr}.games{grid-template-columns:1fr 1fr}.game-link{padding:13px 42px 13px 13px}.game{min-height:105px}}
    @media(max-width:410px){.systems,.games{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>Batocera LAN Arcade</h1><div class="sub">Choose a console or find a game. Connect a controller before launching.</div>
  <nav class="views" aria-label="Library sections">
    <button class="view active" data-view="all">All Games <span class="badge" id="allCount"></span></button>
    <button class="view" data-view="favorites">★ Favorites <span class="badge" id="favoriteCount"></span></button>
    <button class="view" data-view="recent">Recently Played <span class="badge" id="recentCount"></span></button>
  </nav>
  <section id="consoleSection"><h2>Choose a console</h2><div class="systems" id="systems"></div></section>
  <section class="toolbar" aria-label="Game filters">
    <div class="categories" id="categories"></div>
    <div class="filters"><input id="search" type="search" placeholder="Search games…" autocomplete="off"><select id="system"><option value="">All systems</option></select></div>
  </section>
  <div class="summary"><div id="status">Scanning the library…</div><div id="shown"></div></div>
  <div class="games" id="games"></div><button id="more" type="button">Show more games</button>
</main>
<script>
const PAGE_SIZE=160,FAVORITES_KEY='batoceraLanFavorites',RECENT_KEY='batoceraLanRecent';
let allGames=[],filtered=[],shown=0,activeCategory='All',activeView='all',activeSystem='';
const els={systems:document.querySelector('#systems'),consoleSection:document.querySelector('#consoleSection'),categories:document.querySelector('#categories'),search:document.querySelector('#search'),system:document.querySelector('#system'),status:document.querySelector('#status'),shown:document.querySelector('#shown'),games:document.querySelector('#games'),more:document.querySelector('#more'),allCount:document.querySelector('#allCount'),favoriteCount:document.querySelector('#favoriteCount'),recentCount:document.querySelector('#recentCount')};
const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}},save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
let favoritePaths=new Set(load(FAVORITES_KEY,[])),recentPaths=load(RECENT_KEY,[]);
const countBy=(items,key)=>items.reduce((out,item)=>(out[item[key]]=(out[item[key]]||0)+1,out),{});
function updateBadges(){els.allCount.textContent=`(${allGames.length.toLocaleString()})`;els.favoriteCount.textContent=`(${favoritePaths.size.toLocaleString()})`;els.recentCount.textContent=`(${recentPaths.filter(path=>allGames.some(g=>g.path===path)).length.toLocaleString()})`}
function makeCategory(name,count){const button=document.createElement('button');button.type='button';button.className='category'+(name===activeCategory?' active':'');button.textContent=`${name} (${count.toLocaleString()})`;button.dataset.category=name;button.onclick=()=>{activeCategory=name;activeSystem='';syncControls();applyFilters()};return button}
function populateCategories(){const counts=countBy(allGames,'category');els.categories.replaceChildren(makeCategory('All',allGames.length),...Object.keys(counts).sort().map(name=>makeCategory(name,counts[name])))}
function populateSystems(){const current=activeSystem,categoryPool=activeCategory==='All'?allGames:allGames.filter(g=>g.category===activeCategory),counts=countBy(categoryPool,'systemName');els.system.replaceChildren(new Option('All systems',''),...Object.keys(counts).sort().map(name=>new Option(`${name} (${counts[name].toLocaleString()})`,name)));if([...els.system.options].some(o=>o.value===current))els.system.value=current;else activeSystem=''}
function populateConsoleTiles(){const groups={};for(const game of allGames){groups[game.systemName]??={count:0,category:game.category};groups[game.systemName].count++}const buttons=Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([name,data])=>{const button=document.createElement('button');button.type='button';button.className='console'+(activeSystem===name?' active':'');button.innerHTML='<span class="console-name"></span><span class="console-count"></span><span class="console-category"></span>';button.querySelector('.console-name').textContent=name;button.querySelector('.console-count').textContent=`${data.count.toLocaleString()} games`;button.querySelector('.console-category').textContent=data.category;button.onclick=()=>{setView('all');activeCategory=data.category;activeSystem=name;syncControls();applyFilters();document.querySelector('.toolbar').scrollIntoView({behavior:'smooth',block:'start'})};return button});els.systems.replaceChildren(...buttons)}
function syncControls(){els.categories.querySelectorAll('.category').forEach(b=>b.classList.toggle('active',b.dataset.category===activeCategory));populateSystems();els.system.value=activeSystem;populateConsoleTiles()}
function setView(view){activeView=view;document.querySelectorAll('.view').forEach(b=>b.classList.toggle('active',b.dataset.view===view));els.consoleSection.style.display=view==='all'?'block':'none';applyFilters()}
function recordRecent(path){recentPaths=[path,...recentPaths.filter(item=>item!==path)].slice(0,50);save(RECENT_KEY,recentPaths);updateBadges()}
function toggleFavorite(path){if(favoritePaths.has(path))favoritePaths.delete(path);else favoritePaths.add(path);save(FAVORITES_KEY,[...favoritePaths]);updateBadges();if(activeView==='favorites')applyFilters();else document.querySelectorAll('.game').forEach(card=>{if(card.dataset.path===path)card.querySelector('.favorite').classList.toggle('active',favoritePaths.has(path))})}
function gameCard(game){const card=document.createElement('article'),link=document.createElement('a'),favorite=document.createElement('button'),system=document.createElement('div'),name=document.createElement('div');card.className='game';card.dataset.path=game.path;link.className='game-link';link.href='/play.html?core='+encodeURIComponent(game.core)+'&path='+encodeURIComponent(game.path)+'&name='+encodeURIComponent(game.name);link.onclick=()=>recordRecent(game.path);favorite.type='button';favorite.className='favorite'+(favoritePaths.has(game.path)?' active':'');favorite.title='Toggle favorite';favorite.setAttribute('aria-label',`${favoritePaths.has(game.path)?'Remove':'Add'} ${game.name} ${favoritePaths.has(game.path)?'from':'to'} favorites`);favorite.textContent='★';favorite.onclick=()=>toggleFavorite(game.path);system.className='system';name.className='name';system.textContent=game.systemName;name.textContent=game.name;link.append(system,name);card.append(favorite,link);return card}
function render(reset=false){if(reset){shown=0;els.games.replaceChildren()}const end=Math.min(shown+PAGE_SIZE,filtered.length),fragment=document.createDocumentFragment();for(let i=shown;i<end;i++)fragment.append(gameCard(filtered[i]));els.games.append(fragment);shown=end;els.shown.textContent=filtered.length?`${shown.toLocaleString()} of ${filtered.length.toLocaleString()} shown`:'';els.more.style.display=shown<filtered.length?'block':'none';if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=activeView==='favorites'?'No favorites yet. Select the star on any game to add one.':activeView==='recent'?'No recently played games on this device yet.':'No games match these filters.';els.games.append(empty)}}
function applyFilters(){if(!allGames.length)return;const query=els.search.value.trim().toLocaleLowerCase(),system=activeSystem||els.system.value;let pool=allGames;if(activeView==='favorites')pool=pool.filter(g=>favoritePaths.has(g.path));if(activeView==='recent'){const byPath=new Map(allGames.map(g=>[g.path,g]));pool=recentPaths.map(path=>byPath.get(path)).filter(Boolean)}filtered=pool.filter(game=>(activeCategory==='All'||game.category===activeCategory)&&(!system||game.systemName===system)&&(!query||game.name.toLocaleLowerCase().includes(query)));const label=activeView==='favorites'?'favorite':activeView==='recent'?'recent':'game';els.status.textContent=`${filtered.length.toLocaleString()} ${label}${filtered.length===1?'':'s'} found`;render(true)}
document.querySelectorAll('.view').forEach(button=>button.onclick=()=>{activeCategory='All';activeSystem='';syncControls();setView(button.dataset.view)});els.search.addEventListener('input',applyFilters);els.system.addEventListener('change',()=>{activeSystem=els.system.value;populateConsoleTiles();applyFilters()});els.more.addEventListener('click',()=>render(false));
fetch('/api/games').then(response=>{if(!response.ok)throw new Error();return response.json()}).then(items=>{allGames=items;favoritePaths=new Set([...favoritePaths].filter(path=>items.some(g=>g.path===path)));recentPaths=recentPaths.filter(path=>items.some(g=>g.path===path));save(FAVORITES_KEY,[...favoritePaths]);save(RECENT_KEY,recentPaths);populateCategories();populateSystems();populateConsoleTiles();updateBadges();applyFilters()}).catch(()=>els.status.textContent='Could not read the game library.');
</script></body></html>

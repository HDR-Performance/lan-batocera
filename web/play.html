<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>LAN Batocera</title>
<style>html,body,#game{margin:0;width:100%;height:100%;background:#000;overscroll-behavior:none;touch-action:none}.back{position:fixed;z-index:100;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));min-height:46px;display:flex;align-items:center;padding:10px 15px;border:1px solid #ffffff55;border-radius:10px;background:#0c1720e8;color:#fff;text-decoration:none;font:600 14px system-ui;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.back:hover,.back:focus-visible{background:#234;outline:3px solid #41d6c3;outline-offset:2px}@media(pointer:coarse){.back{min-width:92px;min-height:50px;justify-content:center;font-size:15px}}</style></head>
<body><a class="back" href="/">← Library</a><div id="game"></div><script>
const p=new URLSearchParams(location.search),core=p.get('core'),path=p.get('path'),name=p.get('name')||'Game';
if(!core||!path||path.includes('..'))location.replace('/');
document.title=name+' — LAN Batocera';
window.EJS_player='#game';window.EJS_core=core;window.EJS_gameName=name;
window.EJS_gameUrl='/roms/'+path.split('/').map(encodeURIComponent).join('/');
window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
// Starting automatically on a newly navigated page can leave the WebAudio/core
// suspended because browsers do not carry user activation across navigation.
// EmulatorJS's start button supplies the required fresh interaction reliably.
window.EJS_startOnLoaded=false;window.EJS_startButtonName='Start '+name;
window.EJS_language='en-US';window.EJS_askBeforeExit=true;
window.EJS_browserMode=matchMedia('(pointer:coarse)').matches?'mobile':'desktop';
window.EJS_onExit=()=>location.replace('/');
// Some stable CDN builds fail to invoke EJS_onExit after the core shuts down.
// React only when their completed-exit message is newly added so cached pages
// cannot redirect a newly launched game.
new MutationObserver(records=>{for(const record of records)for(const node of record.addedNodes)if(node.textContent?.includes('EmulatorJS has exited')){location.replace('/');return}}).observe(document.body,{childList:true,subtree:true});
</script><script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script></body></html>

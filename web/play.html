<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Arcade</title><style>html,body,#game{margin:0;width:100%;height:100%;background:#000}.back{position:fixed;z-index:20;top:10px;left:10px;padding:8px 12px;border-radius:8px;background:#111b;color:#fff;text-decoration:none;font:14px system-ui}</style></head><body><a class="back" href="/">Library</a><div id="game"></div><script>
const p=new URLSearchParams(location.search), core=p.get('core'), path=p.get('path'), name=p.get('name')||'Game';
if(!core||!path||path.includes('..')) location.replace('/');
document.title=name+' — LAN Arcade';
window.EJS_player='#game'; window.EJS_core=core; window.EJS_gameName=name;
window.EJS_gameUrl='/roms/'+path.split('/').map(encodeURIComponent).join('/');
window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
window.EJS_startOnLoaded=true; window.EJS_language='en-US';
</script><script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script></body></html>

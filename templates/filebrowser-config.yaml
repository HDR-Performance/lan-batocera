server:
  port: 8082
  listen: "127.0.0.1"
  database: "/userdata/system/filebrowser-quantum/filebrowser.db"
  cacheDir: "/userdata/system/filebrowser-quantum/cache"
  sources:
    - path: "/userdata/roms"
      name: "Games"
      config:
        defaultEnabled: true
        rules:
          - folderPath: "/"
            viewable: true
    - path: "/userdata/bios"
      name: "BIOS"
      config: { defaultEnabled: true }
    - path: "/userdata/saves"
      name: "Saves"
      config: { defaultEnabled: true }
    - path: "/userdata/screenshots"
      name: "Screenshots"
      config: { defaultEnabled: true }
auth:
  adminUsername: "Batocera"
  adminPassword: "Batocera"
  # Keep long bulk-upload sessions alive for seven days.
  tokenExpirationHours: 168
  methods:
    password: { enabled: true, minLength: 8, signup: false }
userDefaults:
  listing:
    showSelectMultiple: true
  fileLoading:
    maxConcurrentUpload: 4
    uploadChunkSizeMb: 50
    downloadChunkSizeMb: 0
frontend:
  name: "LAN Batocera File Manager"
  disableDefaultLinks: true
  externalLinks:
    - text: "Auto Extract"
      url: "/lan-batocera-tools"
      title: "Extract one ZIP or auto-extract a game directory"
